services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 30
  ldap:
    build:
      context: .
      dockerfile: infra/ldap/Dockerfile
    ports: ["127.0.0.1:1389:1389"]
    volumes:
      - ./.secrets/bootstrap.ldif:/bootstrap.ldif:ro
      - ldap:/var/lib/ldap
  kdc:
    build:
      context: .
      dockerfile: infra/kerberos/Dockerfile
    secrets: [kdc_master,alice_password]
    ports: ["127.0.0.1:1088:1088/tcp", "127.0.0.1:1088:1088/udp"]
    volumes: ["keytabs:/keytabs", "kdc:/var/lib/krb5kdc"]
  gateway:
    build: .
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_started
      kdc:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sentinel
      DATABASE_USER: sentinel
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/init-local.py}
      LDAP_URL: ldap://ldap:1389
      LDAP_BASE_DN: dc=sentinel,dc=test
      LDAP_BIND_DN: uid=reader,dc=sentinel,dc=test
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:?Run python3 scripts/init-local.py}
      ALLOW_INSECURE_LDAP: 'true'
      KERBEROS_REALM: SENTINEL.TEST
      KERBEROS_SERVICE_PRINCIPAL: HTTP/gateway@SENTINEL.TEST
      KERBEROS_KEYTAB: /keytabs/http.keytab
      TRACE_SAMPLE_PROBABILITY: '1.0'
      COOKIE_SECURE: 'false'
      JAVA_TOOL_OPTIONS: -Djava.security.krb5.conf=/etc/krb5.conf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
    volumes:
      - keytabs:/keytabs:ro
      - ./infra/kerberos/krb5.conf:/etc/krb5.conf:ro
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9090:9090"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  otel:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [--config=/etc/otel/config.yaml]
    volumes: ["./infra/observability/otel.yaml:/etc/otel/config.yaml:ro"]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes: ["./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9091:9090"]
volumes:
  postgres:
  ldap:
  kdc:
  keytabs:
secrets:
  database_password:
    file: .secrets/database_password
  alice_password:
    file: .secrets/alice_password
  kdc_master:
    file: .secrets/kdc_master
