apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  DATABASE_USER: {{ .Values.config.databaseUser | quote }}
  LDAP_URL: {{ .Values.config.ldapUrl | quote }}
  LDAP_BASE_DN: {{ .Values.config.ldapBaseDn | quote }}
  LDAP_BIND_DN: {{ .Values.config.ldapBindDn | quote }}
  KERBEROS_REALM: {{ .Values.config.realm | quote }}
  KERBEROS_SERVICE_PRINCIPAL: {{ .Values.config.servicePrincipal | quote }}
  KERBEROS_KEYTAB: /keytabs/http.keytab
  COOKIE_SECURE: "true"
  ALLOW_INSECURE_LDAP: "false"
  SPRING_FLYWAY_ENABLED: {{ .Values.config.flywayEnabled | quote }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  JAVA_TOOL_OPTIONS: -Djava.security.krb5.conf=/etc/kerberos/krb5.conf -Djavax.net.ssl.trustStore=/trust/truststore.p12
  krb5.conf: |
    [libdefaults]
      default_realm = {{ .Values.config.realm }}
      dns_lookup_kdc = false
      dns_lookup_realm = false
      rdns = false
      udp_preference_limit = 1
      forwardable = false
    [realms]
      {{ .Values.config.realm }} = {
        kdc = {{ .Values.config.kdc }}
      }
